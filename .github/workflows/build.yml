name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: |
          pip install flet==0.84.0
          pip install "flet[all]"

      - name: Build APK
        run: |
          # We force the name, org, and icon directly in the command
          flet build apk \
            --project "Age Calculator" \
            --org "com.yourname" \
            --product "AgeCalculator" \
            --icon "icon.png" \
            --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgeCalculator-APK
          # Using ** helps find the APKs even if they are in subfolders
          path: build/apk/**/*.apk
          
